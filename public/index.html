<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1020">
<meta name="description" content="HAIF: انقل ملفاتك بين جهازين بكود من 3 أرقام مع دردشة داخلية.">
<title>HAIF</title>
<style>[hidden]{display:none!important}html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
/* Layout: a workspace shell. Home picks send/receive. Once paired, a two-column desk:
   files and pairing on the main side, a permanent internal chat on the other. Phones swap them with tabs. */
:root{
  --bg:#0a1020; --surface:#111a32; --surface2:#17223f; --line:#233258;
  --fg:#e9edf9; --muted:#97a4c4; --accent:#8d7dff; --accent-fg:#0a1020; --accent-soft:rgba(141,125,255,.14);
  --accent2:#38d2c2; --ok:#3ddc97; --warn:#ffb454; --bad:#ff7080; --shadow:0 10px 30px rgba(0,0,0,.28);
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#f2f4fa; --surface:#ffffff; --surface2:#eef1fb; --line:#d8def1;
    --fg:#111933; --muted:#586280; --accent:#5a45e6; --accent-fg:#ffffff; --accent-soft:rgba(90,69,230,.1);
    --accent2:#0a8f83; --ok:#12915b; --warn:#a86400; --bad:#c9283c; --shadow:0 10px 30px rgba(30,40,90,.08); color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f2f4fa; --surface:#ffffff; --surface2:#eef1fb; --line:#d8def1;
  --fg:#111933; --muted:#586280; --accent:#5a45e6; --accent-fg:#ffffff; --accent-soft:rgba(90,69,230,.1);
  --accent2:#0a8f83; --ok:#12915b; --warn:#a86400; --bad:#c9283c; --shadow:0 10px 30px rgba(30,40,90,.08); color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin-inline:auto;padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;background:none;border:0;padding:0;text-align:start}
.logo{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}
.logo svg{width:22px;height:22px;stroke-width:2.2}
.brand b{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:.3px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px;display:block}
.sp{flex:1}
.tools{display:flex;gap:8px;align-items:center}
.ib{height:36px;min-width:36px;padding-inline:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500}
.ib:hover{background:var(--surface2)}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.pill code{font-family:var(--f-mono);font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.dot.on{background:var(--ok)}
.sess{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%}

/* typography */
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--f-display);font-size:clamp(28px,5.5vw,42px);line-height:1.2;margin:6px 0 8px;font-weight:700;text-wrap:balance}
h2{font-family:var(--f-display);font-size:21px;margin:0 0 4px;font-weight:600;text-wrap:balance}
p{margin:0}
.lead{color:var(--muted);max-width:60ch}
.view{padding-block:28px;display:flex;flex-direction:column;gap:24px}

/* buttons */
.btn{height:44px;padding-inline:20px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{height:36px;padding-inline:14px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;align-items:center}
.flow{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.flow .dev{display:flex;align-items:center;gap:12px;background:var(--surface2);border-radius:14px;padding:12px 14px}
.flow .dev svg{color:var(--accent)}
.flow .dev small{display:block;color:var(--muted);font-size:12px}
.flow .dev b{font-weight:600}
.flow .link{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;padding-inline:14px}
.flow .link i{flex:1;height:0;border-top:1.5px dashed var(--line)}
.flow .link code{font-family:var(--f-mono);color:var(--accent);font-weight:600;font-size:15px;letter-spacing:.2em}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:14px;text-align:start;padding:22px;border-radius:18px;border:1px solid var(--line);background:var(--surface);min-width:0}
.mode:hover{border-color:var(--c)}
.mode .tile{width:48px;height:48px;border-radius:14px;background:var(--surface2);color:var(--c);display:grid;place-items:center}
.mode .tile svg{width:26px;height:26px}
.mode .go{color:var(--c);font-weight:600;display:inline-flex;gap:6px;align-items:center}
.mode.s{--c:var(--accent)} .mode.r{--c:var(--accent2)}
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0;border-top:1px solid var(--line)}
.feat{display:flex;gap:12px;padding:18px 0;padding-inline-end:16px;min-width:0}
.feat svg{color:var(--accent);margin-top:2px}
.feat b{display:block;font-weight:600}
.feat span{color:var(--muted);font-size:14px}
.note{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:12px;padding:12px 14px}
.note svg{width:18px;height:18px;margin-top:2px}

/* panels + workspace */
.panel{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:18px;min-width:0}
.work{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.main{display:flex;flex-direction:column;gap:20px;min-width:0}
.tabs{display:none;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;height:38px;border:0;border-radius:9px;background:none;font-weight:600;color:var(--muted);display:inline-flex;gap:8px;align-items:center;justify-content:center}
.tabs button.on{background:var(--accent-soft);color:var(--accent)}
.tabs .n,.unread{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;display:inline-grid;place-items:center;padding-inline:5px}
.code{display:flex;gap:10px;direction:ltr;justify-content:center}
.code span{width:72px;height:88px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:44px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.status{display:flex;gap:10px;align-items:center;justify-content:center;color:var(--muted)}
.status.ok{color:var(--ok)}
.status .dot{animation:pulse 1.6s ease-in-out infinite}
.status.ok .dot{animation:none;background:var(--ok)}
@keyframes pulse{50%{opacity:.3}}
.drop{border:1.5px dashed var(--line);border-radius:16px;padding:28px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop svg{width:32px;height:32px;color:var(--accent)}
.drop b{color:var(--fg)}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stats{display:flex;gap:16px;color:var(--muted);font-size:13px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column}
.empty{color:var(--muted);padding:14px 0;text-align:center;font-size:14px}
.file{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.file:first-child{border-top:0}
.thumb{width:44px;height:44px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;color:var(--muted);overflow:hidden;font-family:var(--f-mono);font-size:11px;text-transform:uppercase}
.thumb img{width:100%;height:100%;object-fit:cover}
.fi{min-width:0}
.fi b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi small{color:var(--muted);font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:5px;background:var(--surface2);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.file.done .bar i{background:var(--ok)}
.pct{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.file.done .pct{color:var(--ok)}
.entry{display:flex;gap:10px;direction:ltr;justify-content:center;flex-wrap:wrap}
.entry input{width:min(220px,100%);height:64px;text-align:center;font-family:var(--f-mono);font-size:34px;letter-spacing:.35em;padding-inline-start:.35em;border-radius:14px;border:1px solid var(--line);background:var(--surface2);font-variant-numeric:tabular-nums}
.err{color:var(--bad);text-align:center;font-size:14px;min-height:22px}
.back{align-self:flex-start;background:none;border:0;color:var(--muted);display:inline-flex;gap:6px;align-items:center;padding:4px 0}
.back:hover{color:var(--fg)}
.joinbox{max-width:560px;width:100%;margin-inline:auto;display:flex;flex-direction:column;gap:20px}

/* internal chat */
.chat{background:var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;height:min(620px,calc(100vh - 150px));min-height:420px;position:sticky;top:calc(84px + env(safe-area-inset-top,0px));overflow:hidden}
.chat>header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.av{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.chat>header b{font-family:var(--f-display);font-weight:600;display:block;line-height:1.2}
.chat>header small{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:82%;padding:8px 12px 6px;border-radius:14px;border-end-start-radius:4px;background:var(--surface2);overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-end-start-radius:14px;border-end-end-radius:4px}
.m time{display:block;font-family:var(--f-mono);font-size:10.5px;opacity:.65;margin-top:2px}
.sys{align-self:center;color:var(--muted);font-size:12px;background:var(--surface2);border-radius:999px;padding:3px 12px;max-width:90%;text-align:center;overflow-wrap:anywhere}
.cempty{margin:auto;text-align:center;color:var(--muted);font-size:14px;max-width:26ch;display:flex;flex-direction:column;gap:8px;align-items:center}
.cempty svg{width:30px;height:30px;color:var(--accent)}
.typing{padding:0 18px 6px;color:var(--muted);font-size:12px;min-height:22px}
.chat form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.chat input{flex:1;min-width:0;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding-inline:14px}
.chat input:disabled{opacity:.55}
.sendb{width:42px;height:42px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;flex:none}
.sendb[disabled]{opacity:.5;cursor:not-allowed}

/* modal */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(5,9,20,.6);display:grid;place-items:center;padding:16px}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.dlg dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;color:var(--muted);font-size:14px}
.dlg dd{margin:0;color:var(--fg);font-weight:500}
.dlg .col{display:flex;flex-direction:column;gap:8px}
footer{border-top:1px solid var(--line);padding-block:18px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:899px){
  .work{grid-template-columns:minmax(0,1fr)}
  .tabs{display:flex}
  .work[data-tab="files"] .chat{display:none}
  .work[data-tab="chat"] .main{display:none}
  .chat{position:static;height:min(560px,70vh)}
  .hero{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:480px){.code span{width:60px;height:76px;font-size:36px}.top .tools{margin-inline-start:auto}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app" dir="rtl" lang="ar">
  <div class="wrap">
    <header class="top">
      <button class="brand" id="homeBtn" type="button" aria-label="HAIF">
        <span class="logo"><svg class="i" viewBox="0 0 24 24"><path d="M4 8h13M13 4l4 4-4 4M20 16H7M11 12l-4 4 4 4"/></svg></span>
        <span><b>HAIF</b><small data-i18n="tag"></small></span>
      </button>
      <span class="sp"></span>
      <div class="tools">
        <button class="ib" id="langBtn" type="button" aria-label="Language"></button>
        <button class="ib" id="themeBtn" type="button" aria-label="Theme">
          <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
      <div class="sess" id="sess" hidden>
        <span class="pill"><span class="dot" id="sessDot"></span><span id="sessTxt"></span><code id="sessCode"></code></span>
        <button class="btn sm" id="sessBack" type="button" data-i18n="backSess"></button>
        <button class="btn sm danger" id="sessEnd" type="button" data-i18n="endConn"></button>
      </div>
    </header>

    <!-- HOME -->
    <section class="view" id="v-home">
      <div class="hero">
        <div>
          <span class="eyebrow">HAIF · 2026</span>
          <h1 data-i18n="homeTitle"></h1>
          <p class="lead" data-i18n="homeLead"></p>
        </div>
        <div class="flow" aria-hidden="true">
          <div class="dev"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><div><small data-i18n="devA"></small><b data-i18n="devAn"></b></div></div>
          <div class="link"><i></i><code>427</code><i></i></div>
          <div class="dev"><svg class="i" viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg><div><small data-i18n="devB"></small><b data-i18n="devBn"></b></div></div>
        </div>
      </div>
      <div class="modes">
        <button class="mode s" id="goSend" type="button">
          <span class="tile"><svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span>
          <span><h2 data-i18n="sendT"></h2><p class="lead" data-i18n="sendD"></p></span>
          <span class="go"><span data-i18n="sendGo"></span><svg class="i" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></span>
        </button>
        <button class="mode r" id="goRecv" type="button">
          <span class="tile"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg></span>
          <span><h2 data-i18n="recvT"></h2><p class="lead" data-i18n="recvD"></p></span>
          <span class="go"><span data-i18n="recvGo"></span><svg class="i" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></span>
        </button>
      </div>
      <div class="feats">
        <div class="feat"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><div><b data-i18n="f1t"></b><span data-i18n="f1d"></span></div></div>
        <div class="feat"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><div><b data-i18n="f2t"></b><span data-i18n="f2d"></span></div></div>
        <div class="feat"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg><div><b data-i18n="f3t"></b><span data-i18n="f3d"></span></div></div>
      </div>
      <div class="note"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span data-i18n="demoNote"></span></div>
    </section>

    <!-- SEND -->
    <section class="view" id="v-send" hidden>
      <button class="back" type="button" data-back><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg><span data-i18n="back"></span></button>
      <div><span class="eyebrow" data-i18n="step1"></span><h1 data-i18n="connT"></h1><p class="lead" data-i18n="connD"></p></div>
      <div class="tabs" data-tabs>
        <button type="button" data-tab="files" class="on"><span data-i18n="tFiles"></span></button>
        <button type="button" data-tab="chat"><span data-i18n="chat"></span><span class="n unread" hidden>0</span></button>
      </div>
      <div class="work" data-work data-tab="files">
        <div class="main">
          <div class="panel">
            <p class="lead" style="text-align:center" data-i18n="yourCode"></p>
            <div class="code" id="codeBoxes"></div>
            <div class="row">
              <button class="btn pri" id="copyLink" type="button" data-i18n="copyLink"></button>
              <button class="btn" id="copyCode" type="button" data-i18n="copyCode"></button>
            </div>
            <div class="status" id="sStatus"><span class="dot"></span><span id="sStatusTxt"></span></div>
          </div>
          <div class="panel">
            <div class="head"><h2 data-i18n="sendFiles"></h2><div class="stats"><span id="sStat"></span><button class="btn sm" id="pauseBtn" type="button"></button></div></div>
            <label class="drop" id="drop" for="picker">
              <svg class="i" viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1-.6-7.96A6 6 0 0 1 18 9.5a4.2 4.2 0 0 1-.5 8.5H7zM12 17v-6M9 13l3-3 3 3"/></svg>
              <b data-i18n="dropT"></b><span data-i18n="dropD"></span>
              <span class="btn pri sm" data-i18n="pick"></span>
            </label>
            <input type="file" id="picker" multiple hidden>
            <div class="list" id="sendList"></div>
          </div>
        </div>
        <div id="slot-send"></div>
      </div>
    </section>

    <!-- RECEIVE -->
    <section class="view" id="v-recv" hidden>
      <button class="back" type="button" data-back><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg><span data-i18n="back"></span></button>
      <div class="joinbox" id="rJoin">

function join(code){
  $("#joinErr").textContent="";S.code=code;S.mode="recv";save();
  wsOpen(function(){wsSend({type:"join",code:code})});
}
$("#joinBtn").onclick=function(){var v=$("#codeIn").value.replace(/\D/g,"");if(v.length===3)join(v);else $("#joinErr").textContent=t("badCode")};
$("#codeIn").addEventListener("input",function(){this.value=this.value.replace(/\D/g,"");$("#joinErr").textContent=""});
$("#codeIn").addEventListener("keydown",function(e){if(e.key==="Enter")$("#joinBtn").click()});

/* file rows */
function ext(n){var m=/\.([a-z0-9]{1,4})$/i.exec(n);return m?m[1]:"file"}
function row(name,size){
  var r=document.createElement("div");r.className="file";
  r.innerHTML='<div class="thumb"></div><div class="fi"><b></b><small></small><div class="bar"><i></i></div></div><span class="pct">0%</span>';
  r.querySelector("b").textContent=name;r.querySelector("small").textContent=fmt(size);r.querySelector(".thumb").textContent=ext(name);
  return {root:r,bar:r.querySelector(".bar i"),pct:r.querySelector(".pct"),thumb:r.querySelector(".thumb")};
}
function setP(r,p){r.bar.style.width=p+"%";r.pct.textContent=Math.round(p)+"%";if(p>=100)r.root.classList.add("done")}
function addRow(sel,r){var l=$(sel),e=l.querySelector(".empty");if(e)e.remove();l.appendChild(r.root)}

/* send */
function addFiles(files){
  Array.prototype.forEach.call(files,function(f){
    var r=row(f.name,f.size);addRow("#sendList",r);
    S.queue.push({file:f,row:r,fid:S.id+"-"+Date.now()+"-"+Math.random().toString(36).slice(2,6)});
  });
  pump();
}
async function pump(){
  if(S.pumping)return;S.pumping=true;
  while(S.queue.length){
    var q=S.queue[0];
    while(!S.connected||S.paused){await sleep(150);if(!S.mode){S.pumping=false;return}}
    var f=q.file,total=Math.max(1,Math.ceil(f.size/CH));
    post({t:"meta",fid:q.fid,name:f.name,size:f.size,type:f.type,total:total});
    for(var i=0;i<total;i++){
      while(!S.connected||S.paused){await sleep(150);if(!S.mode){S.pumping=false;return}}
      var buf=await f.slice(i*CH,(i+1)*CH).arrayBuffer();
      await sendChunk(q.fid,i,buf);
      setP(q.row,((i+1)/total)*100);
      if(i%4===3)await sleep(4);
    }
    post({t:"done",fid:q.fid});setP(q.row,100);S.queue.shift();
    S.sent++;S.sentBytes+=f.size;sys(t("sysSent")+f.name);render();
  }
  S.pumping=false;
}
$("#picker").onchange=function(){addFiles(this.files);this.value=""};
$("#pauseBtn").onclick=function(){S.paused=!S.paused;render()};
var dz=$("#drop");
["dragenter","dragover"].forEach(function(n){dz.addEventListener(n,function(e){e.preventDefault();dz.classList.add("over")})});
["dragleave","drop"].forEach(function(n){dz.addEventListener(n,function(e){e.preventDefault();dz.classList.remove("over")})});
dz.addEventListener("drop",function(e){if(e.dataTransfer&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files)});

/* chat */
function updUnread(){
  var show=S.unread>0&&!chatVisible();
  $$(".unread").forEach(function(u){u.hidden=!show;u.textContent=S.unread});
}
function clearEmpty(){if(!S.hadMsgs){$("#msgs").innerHTML="";S.hadMsgs=true}}
function pushMsg(el){clearEmpty();var m=$("#msgs");m.appendChild(el);m.scrollTop=m.scrollHeight}
function addMsg(text,me){
  var d=document.createElement("div");d.className="m"+(me?" me":"");
  var p=document.createElement("span");p.textContent=text;var tm=document.createElement("time");tm.textContent=hhmm();
  d.appendChild(p);d.appendChild(tm);pushMsg(d);
}
function sys(text){var d=document.createElement("div");d.className="sys";d.textContent=text;pushMsg(d)}
var lastTyping=0,typingTimer=null;
$("#chatIn").addEventListener("input",function(){var n=Date.now();if(S.connected&&n-lastTyping>1200){lastTyping=n;post({t:"typing"})}});
$("#chatForm").onsubmit=function(e){
  e.preventDefault();var v=$("#chatIn").value.trim();if(!v||!S.connected)return;
  post({t:"chat",text:v});addMsg(v,true);$("#chatIn").value="";
};

/* incoming messages */
function peerGone(){
  S.connected=false;S.peer=null;sys(t("sysLeft"));
  var w=T.ws;closeT();
  if(S.mode==="send"){render();$("#sStatusTxt").textContent=t("left");setTimeout(function(){if(S.mode==="send"&&!S.connected)hostConnect()},400)}
  else{S.mode="recv";render();setView("recv");$("#joinErr").textContent=t("left")}
}
function gotChunk(h,buf){
  var inc=S.incoming[h.fid];if(!inc)return;
  inc.parts[h.idx]=buf;inc.got++;setP(inc.row,(inc.got/inc.total)*99.9);
}
function handle(m){
  if(!S.connected)return;
  if(m.t==="bye"){peerGone();return}
  if(m.t==="typing"){
    $("#typing").textContent=t("typing");clearTimeout(typingTimer);
    typingTimer=setTimeout(function(){$("#typing").textContent=""},2500);return;
  }
  if(m.t==="chat"){
    $("#typing").textContent="";addMsg(m.text,false);
    if(!chatVisible()){S.unread++;updUnread()}
    return;
  }
  if(m.t==="chunk"){T.hdr=m;return}
  if(S.mode!=="recv")return;
  if(m.t==="meta"){
    var r=row(m.name,m.size);addRow("#recvList",r);
    S.incoming[m.fid]={row:r,parts:[],got:0,size:m.size,type:m.type,total:m.total,name:m.name};return;
  }
  var inc=S.incoming[m.fid];if(!inc)return;
  if(m.t==="done"){
    var blob=new Blob(inc.parts,{type:inc.type||"application/octet-stream"});
    setP(inc.row,100);
    var url=URL.createObjectURL(blob);
    if(/^image\//.test(inc.type)){
      var img=document.createElement("img");img.alt="";img.src=url;
      inc.row.thumb.textContent="";inc.row.thumb.appendChild(img);
    }
    var a=document.createElement("a");a.href=url;a.download=inc.name;a.className="btn sm";a.textContent=t("save");
    inc.row.root.appendChild(a);inc.row.root.style.gridTemplateColumns="44px 1fr auto auto";
    inc.parts=[];S.got++;S.gotBytes+=inc.size;sys(t("sysGot")+inc.name);render();
  }
}
matchMedia("(min-width:900px)").addEventListener&&matchMedia("(min-width:900px)").addEventListener("change",updUnread);

/* boot */
applyLang();
var h=/^#r(\d{3})$/.exec(location.hash||""),saved=null;
try{saved=JSON.parse(sessionStorage.getItem("abk-sess")||"null")}catch(e){}
if(h){startRecv();$("#codeIn").value=h[1];join(h[1])}
else if(saved&&saved.code){
  S.code=saved.code;
  if(saved.mode==="send"){S.mode="send";drawCode();render();hostConnect()}
  else{S.mode="recv";render();join(saved.code)}
}
})();
</script>
