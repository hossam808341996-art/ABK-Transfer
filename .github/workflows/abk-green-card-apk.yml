name: ABK Green Card Photo APK (public download)
on:
  push:
    branches:
      - abk-green-card-photo-pro-release
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android APK
        working-directory: android-greencard
        run: gradle --no-daemon :app:assembleDebug
      - name: Check installable APK
        run: |
          test -s android-greencard/app/build/outputs/apk/debug/app-debug.apk
          file android-greencard/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-greencard/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish public APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-greencard/app/build/outputs/apk/debug/app-debug.apk ABK-GREEN-CARD-PHOTO-PRO.apk
          TAG="abk-green-card-photo-v1.1.0-public"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ABK-GREEN-CARD-PHOTO-PRO.apk --clobber
          else
            gh release create "$TAG" ABK-GREEN-CARD-PHOTO-PRO.apk --target "$GITHUB_SHA" --title "ABK Green Card Photo Pro Android APK v1.1.0" --notes "Android APK camera app. Debug-signed testing release. Automated photo checks cannot guarantee official acceptance."
          fi
